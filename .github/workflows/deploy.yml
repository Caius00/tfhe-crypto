name: Deploy Service

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service
        type: choice
        required: true
        options:
          - encrypted-key-value-store
          - encrypted-age-verification
          - encrypted-voting-polling
          - sealed-bid-auction
          - encrypted-statistics-service
          - encrypted-genomics
          - encrypted-image-processing
          - encrypted-leaderboard
          - encrypted-program-execution

env:
  SERVICE: ${{ inputs.service }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.service }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ${{ env.SERVICE }}

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --build-arg SERVICE_NAME=${{ env.SERVICE }} -t ${{ env.IMAGE }}:latest .

  push:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          build-args: SERVICE_NAME=${{ env.SERVICE }}
          tags: ${{ env.IMAGE }}:latest
