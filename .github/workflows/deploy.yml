name: Deploy Service

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service
        type: choice
        required: true
        options:
          - encrypted-key-value-store
          - encrypted-age-verification
          - encrypted-voting-polling
          - sealed-bid-auction
          - encrypted-statistics-service
          - encrypted-genomics
          - encrypted-image-processing
          - encrypted-leaderboard
          - encrypted-program-execution
  push:
    tags:
      - '*-v[0-9]*'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.vars.outputs.service }}
      version: ${{ steps.vars.outputs.version }}
      major_minor: ${{ steps.vars.outputs.major_minor }}
      major: ${{ steps.vars.outputs.major }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION=$(echo "$TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$')
            SERVICE=$(echo "$TAG" | sed "s/-v${VERSION}$//")
            echo "major_minor=$(echo $VERSION | cut -d'.' -f1-2)" >> $GITHUB_OUTPUT
            echo "major=$(echo $VERSION | cut -d'.' -f1)" >> $GITHUB_OUTPUT
          else
            SERVICE="${{ inputs.service }}"
            VERSION="latest"
            echo "major_minor=" >> $GITHUB_OUTPUT
            echo "major=" >> $GITHUB_OUTPUT
          fi
          echo "service=$SERVICE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${{ github.repository_owner }}/$SERVICE" >> $GITHUB_OUTPUT

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: deploy
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run -p ${{ needs.setup.outputs.service }} --no-tests=pass

  build-push:
    needs: [setup, test]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ needs.setup.outputs.image }}
          tags: |
            type=raw,value=${{ needs.setup.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ needs.setup.outputs.major_minor }},enable=${{ github.ref_type == 'tag' && needs.setup.outputs.major_minor != '' }}
            type=raw,value=${{ needs.setup.outputs.major }},enable=${{ github.ref_type == 'tag' && needs.setup.outputs.major != '' }}
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          push: true
          build-args: SERVICE_NAME=${{ needs.setup.outputs.service }}
          tags: ${{ steps.meta.outputs.tags }}

  update-readme:
    needs: [setup, build-push]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main
      - name: Update version badges
        run: |
          SERVICE="${{ needs.setup.outputs.service }}"
          VERSION="${{ needs.setup.outputs.version }}"
          sed -i "s|version-[0-9]*\.[0-9]*\.[0-9]*-blue|version-$VERSION-blue|g" \
            services/*-"$SERVICE"/README.md
          sed -i "/$SERVICE/s|version-[0-9]*\.[0-9]*\.[0-9]*-blue|version-$VERSION-blue|g" \
            README.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md services/
          git commit -m "chore: bump ${{ needs.setup.outputs.service }} to v${{ needs.setup.outputs.version }} [skip ci]" || echo "Nothing to commit"
          git push
