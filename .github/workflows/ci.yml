name: CI

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

#concurrency:
#  group: ci-${{ github.ref }}
#  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: arc-runners
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            s01:
              - 'services/01-encrypted-key-value-store/**'
              - 'shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            s02:
              - 'services/02-encrypted-age-verification/**'
              - 'shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            s03:
              - 'services/03-encrypted-voting-polling/**'
              - 'shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            s04:
              - 'services/04-sealed-bid-auction/**'
              - 'shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            s05:
              - 'services/05-encrypted-statistics-service/**'
              - 'shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            s06:
              - 'services/06-encrypted-genomics/**'
              - 'shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            s07:
              - 'services/07-encrypted-image-processing/**'
              - 'shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            s08:
              - 'services/08-encrypted-leaderboard/**'
              - 'shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            s09:
              - 'services/09-encrypted-program-execution/**'
              - 'shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

      - id: matrix
        run: |
          INCLUDE='[]'
          add() { INCLUDE=$(echo "$INCLUDE" | jq -c ". + [{\"nr\":\"$1\",\"service\":\"$2\"}]"); }

          [ "${{ steps.filter.outputs.s01 }}" = "true" ] && add "01" "encrypted-key-value-store"
          [ "${{ steps.filter.outputs.s02 }}" = "true" ] && add "02" "encrypted-age-verification"
          [ "${{ steps.filter.outputs.s03 }}" = "true" ] && add "03" "encrypted-voting-polling"
          [ "${{ steps.filter.outputs.s04 }}" = "true" ] && add "04" "sealed-bid-auction"
          [ "${{ steps.filter.outputs.s05 }}" = "true" ] && add "05" "encrypted-statistics-service"
          [ "${{ steps.filter.outputs.s06 }}" = "true" ] && add "06" "encrypted-genomics"
          [ "${{ steps.filter.outputs.s07 }}" = "true" ] && add "07" "encrypted-image-processing"
          [ "${{ steps.filter.outputs.s08 }}" = "true" ] && add "08" "encrypted-leaderboard"
          [ "${{ steps.filter.outputs.s09 }}" = "true" ] && add "09" "encrypted-program-execution"

          echo "matrix={\"include\":$INCLUDE}" >> $GITHUB_OUTPUT
          [ "$INCLUDE" = "[]" ] && echo "any=false" >> $GITHUB_OUTPUT || echo "any=true" >> $GITHUB_OUTPUT

  check:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    name: "${{ matrix.nr }} ${{ matrix.service }}"
    runs-on: arc-runners
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Format
        id: fmt
        run: cargo fmt -p ${{ matrix.service }} -- --check

      - name: Clippy
        id: clippy
        run: cargo clippy -p ${{ matrix.service }} -- -D warnings

      - name: Install nextest & cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov

      # Tests laufen im Release-Modus (FHE-Crates sind im Debug ~10× langsamer)
      # und seriell (--test-threads=1), damit teure ServerKey-Allokationen sich
      # nicht gegenseitig den Speicher wegnehmen.
      - name: Test (mit Coverage)
        id: test
        run: |
          cargo llvm-cov nextest --release \
            -p ${{ matrix.service }} \
            --no-tests=pass \
            --test-threads=1 \
            --summary-only \
            | tee coverage.txt

      # Liest die Line-Coverage aus der TOTAL-Zeile heraus.
      # Wenn keine Tests etwas berührt haben (lines == missed), wird "—" gesetzt
      # statt "0.00%" — sonst wäre der Wert für untestete Services irreführend.
      - name: Coverage extrahieren
        if: always()
        id: coverage
        run: |
          TOTAL_LINE=$(grep -E '^TOTAL' coverage.txt 2>/dev/null | head -1 || true)
          if [ -z "$TOTAL_LINE" ]; then
            echo "lines=—" >> "$GITHUB_OUTPUT"
          else
            LINES=$(echo "$TOTAL_LINE" | awk '{print $8}')
            MISSED=$(echo "$TOTAL_LINE" | awk '{print $9}')
            PCT=$(echo "$TOTAL_LINE" | awk '{print $10}')
            if [ "$LINES" = "$MISSED" ]; then
              echo "lines=—" >> "$GITHUB_OUTPUT"
            else
              echo "lines=$PCT" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Save result
        if: always()
        run: |
          mkdir result
          printf 'fmt=%s\nclippy=%s\ntest=%s\ncoverage=%s\n' \
            '${{ steps.fmt.outcome }}' \
            '${{ steps.clippy.outcome }}' \
            '${{ steps.test.outcome }}' \
            '${{ steps.coverage.outputs.lines }}' \
            > result/outcome.txt
          echo '${{ matrix.nr }}' > result/nr.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.nr }}-${{ matrix.service }}
          path: result/

  summary:
    needs: check
    if: always()
    runs-on: arc-runners
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results

      - name: Build summary
        run: |
          icon() { case "$1" in success) echo "✅";; skipped) echo "⏭️";; *) echo "❌";; esac; }

          {
            echo "| # | Service | Format | Clippy | Test | Coverage |"
            echo "|---|---------|:------:|:------:|:----:|:--------:|"
            for dir in $(ls -d results/result-* 2>/dev/null | sort); do
              service="${dir#results/result-??-}"
              nr=$(cat "$dir/nr.txt")
              fmt=$(grep    "^fmt="      "$dir/outcome.txt" | cut -d= -f2)
              clippy=$(grep "^clippy="   "$dir/outcome.txt" | cut -d= -f2)
              test=$(grep   "^test="     "$dir/outcome.txt" | cut -d= -f2)
              cov=$(grep    "^coverage=" "$dir/outcome.txt" | cut -d= -f2)
              [ -z "$cov" ] && cov="—"
              echo "| $nr | \`$service\` | $(icon $fmt) | $(icon $clippy) | $(icon $test) | $cov |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
