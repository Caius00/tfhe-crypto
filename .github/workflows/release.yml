name: Build and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

concurrency:
  group: build-deploy
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            s01:
              - 'services/01-encrypted-key-value-store/**'
              - 'shared/**'
              - 'Cargo.toml'
            s02:
              - 'services/02-encrypted-age-verification/**'
              - 'shared/**'
              - 'Cargo.toml'
            s03:
              - 'services/03-encrypted-voting-polling/**'
              - 'shared/**'
              - 'Cargo.toml'
            s04:
              - 'services/04-sealed-bid-auction/**'
              - 'shared/**'
              - 'Cargo.toml'
            s05:
              - 'services/05-encrypted-statistics-service/**'
              - 'shared/**'
              - 'Cargo.toml'
            s06:
              - 'services/06-encrypted-genomics/**'
              - 'shared/**'
              - 'Cargo.toml'
            s07:
              - 'services/07-encrypted-image-processing/**'
              - 'shared/**'
              - 'Cargo.toml'
            s08:
              - 'services/08-encrypted-leaderboard/**'
              - 'shared/**'
              - 'Cargo.toml'
            s09:
              - 'services/09-encrypted-program-execution/**'
              - 'shared/**'
              - 'Cargo.toml'

      - id: matrix
        run: |
          INCLUDE='[]'
          add() { INCLUDE=$(echo "$INCLUDE" | jq -c ". + [{\"nr\":\"$1\",\"service\":\"$2\",\"dir\":\"$3\"}]"); }

          [ "${{ steps.filter.outputs.s01 }}" = "true" ] && add "01" "encrypted-key-value-store"   "01-encrypted-key-value-store"
          [ "${{ steps.filter.outputs.s02 }}" = "true" ] && add "02" "encrypted-age-verification"  "02-encrypted-age-verification"
          [ "${{ steps.filter.outputs.s03 }}" = "true" ] && add "03" "encrypted-voting-polling"    "03-encrypted-voting-polling"
          [ "${{ steps.filter.outputs.s04 }}" = "true" ] && add "04" "sealed-bid-auction"          "04-sealed-bid-auction"
          [ "${{ steps.filter.outputs.s05 }}" = "true" ] && add "05" "encrypted-statistics-service" "05-encrypted-statistics-service"
          [ "${{ steps.filter.outputs.s06 }}" = "true" ] && add "06" "encrypted-genomics"          "06-encrypted-genomics"
          [ "${{ steps.filter.outputs.s07 }}" = "true" ] && add "07" "encrypted-image-processing"  "07-encrypted-image-processing"
          [ "${{ steps.filter.outputs.s08 }}" = "true" ] && add "08" "encrypted-leaderboard"       "08-encrypted-leaderboard"
          [ "${{ steps.filter.outputs.s09 }}" = "true" ] && add "09" "encrypted-program-execution" "09-encrypted-program-execution"

          echo "matrix={\"include\":$INCLUDE}" >> $GITHUB_OUTPUT
          [ "$INCLUDE" = "[]" ] && echo "any=false" >> $GITHUB_OUTPUT || echo "any=true" >> $GITHUB_OUTPUT

  bump:
    needs: setup
    if: needs.setup.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.bump.outputs.matrix }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bump

      - id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          UPDATED='{"include":[]}'

          for row in $(echo '${{ needs.setup.outputs.matrix }}' | jq -c '.include[]'); do
            NR=$(echo "$row"      | jq -r '.nr')
            SERVICE=$(echo "$row" | jq -r '.service')
            DIR=$(echo "$row"     | jq -r '.dir')

            CARGO="services/$DIR/Cargo.toml"
            CURRENT=$(grep '^version = ' "$CARGO" | cut -d'"' -f2)
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            NEW="$MAJOR.$MINOR.$((PATCH + 1))"

            sed -i "s/^version = \"$CURRENT\"/version = \"$NEW\"/" "$CARGO"
            cargo update -p "$SERVICE" --precise "$NEW"

            UPDATED=$(echo "$UPDATED" | jq -c ".include += [{\"nr\":\"$NR\",\"service\":\"$SERVICE\",\"dir\":\"$DIR\",\"version\":\"$NEW\"}]")
          done

          git add -A
          git diff --cached --quiet || git commit -m "chore: bump versions [skip ci]"
          git push

          echo "matrix=$UPDATED" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  # Test + Docker-Push pro Service. `fail-fast: false` damit ein
  # fehlschlagender Service nicht die anderen Matrix-Jobs abbricht.
  # Jeder erfolgreiche Service lädt einen Marker-Artifact hoch –
  # `update-readme` / `update-helm` lesen die und bearbeiten nur diese.
  build-push:
    needs: [setup, bump]
    if: needs.setup.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.bump.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: deploy

      - run: cargo test --release -p ${{ matrix.service }} -- --test-threads=1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/caius00/${{ matrix.service }}
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          push: true
          build-args: SERVICE_NAME=${{ matrix.service }}
          tags: ${{ steps.meta.outputs.tags }}

      # Wird nur erreicht, wenn Tests + Docker-Push erfolgreich waren.
      - name: Mark service as released
        run: |
          mkdir -p _released
          echo '${{ toJson(matrix) }}' > "_released/${{ matrix.nr }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: released-${{ matrix.nr }}
          path: _released/${{ matrix.nr }}.json
          retention-days: 1

  # Readme-Badges + Helm-Tags nur für Services, die `build-push`
  # erfolgreich durchlaufen haben. `if: always()` damit der Job auch
  # läuft, wenn ein Service in build-push gescheitert ist.
  update-readme:
    needs: [bump, build-push]
    if: always() && needs.bump.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}

      - uses: actions/download-artifact@v4
        with:
          pattern: released-*
          path: _released
          merge-multiple: true

      - name: Update version badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          files=(_released/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Kein Service hat build-push erfolgreich abgeschlossen – nichts zu aktualisieren."
            exit 0
          fi

          for f in "${files[@]}"; do
            SERVICE=$(jq -r '.service' "$f")
            DIR=$(jq -r '.dir' "$f")
            VERSION=$(jq -r '.version' "$f")

            sed -i "s|version-[0-9]*\.[0-9]*\.[0-9]*-blue|version-$VERSION-blue|g" "services/$DIR/README.md" 2>/dev/null || true
            sed -i "/$SERVICE/s|version-[0-9]*\.[0-9]*\.[0-9]*-blue|version-$VERSION-blue|g" README.md 2>/dev/null || true
          done

          git add -A
          git diff --cached --quiet || git commit -m "chore: update version badges [skip ci]"
          git push

  update-helm:
    needs: [bump, build-push, update-readme]
    if: always() && needs.bump.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}

      - uses: actions/download-artifact@v4
        with:
          pattern: released-*
          path: _released
          merge-multiple: true

      - name: Update Helm chart image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          files=(_released/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Kein Service hat build-push erfolgreich abgeschlossen – nichts zu aktualisieren."
            exit 0
          fi

          for f in "${files[@]}"; do
            DIR=$(jq -r '.dir' "$f")
            VERSION=$(jq -r '.version' "$f")

            sed -i "s/^  tag: .*/  tag: \"$VERSION\"/" "helm/services/$DIR/values.yaml"
          done

          git add -A
          git diff --cached --quiet || git commit -m "chore: update helm image tags [skip ci]"
          git push
