[workspace]
resolver = "2"
members = [
    "shared/health",
    "services/01-encrypted-key-value-store",
    "services/02-encrypted-age-verification",
    "services/03-encrypted-voting-polling",
    "services/04-sealed-bid-auction",
    "services/05-encrypted-statistics-service",
    "services/06-encrypted-genomics",
    "services/07-encrypted-image-processing",
    "services/08-encrypted-leaderboard",
    "services/09-encrypted-program-execution",
]

[workspace.dependencies]
axum = "0.8"
health = { path = "shared/health" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tfhe = { version = "1.5.4", features = ["boolean", "shortint", "integer"] }

# tfhe-rs ist ohne Optimierung praktisch unbenutzbar (Schlüsselgenerierung
# dauert dann Minuten statt Sekunden, FHE-Ops sind ~10× langsamer). Wir
# optimieren nur die `tfhe`-Crate selbst — der eigene Code bleibt im Debug
# (Breakpoints/Logs funktionieren weiter, nichts wird länger zu kompilieren).
[profile.dev.package.tfhe]
opt-level = 3

[profile.test.package.tfhe]
opt-level = 3
