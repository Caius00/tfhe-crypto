# Tests, die einen kompletten FHE-ServerKey laden (mehrere hundert MB) und
# einen eigenen rayon-Pool spawnen, müssen seriell laufen — sonst belegen
# parallel laufende Tests den RAM auf kleinen Runnern komplett.
#
# Jeder Service mit FHE-schweren Tests kommt hier als eigener Override-Block
# rein und wird der `fhe-heavy`-Gruppe zugeordnet.
[test-groups]
fhe-heavy = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(encrypted-leaderboard)'
test-group = 'fhe-heavy'

# Wenn ein Service Tests bekommt, die einen ServerKey laden, einfach den
# entsprechenden Block einkommentieren:

