<app-card>
  <div class="qi-header">
    <span class="qi-index">Frage {{ index }}</span>
  </div>

  <p class="qi-text">{{ question.text }}</p>

  <div class="qi-input">
    @switch (question.question_type) {

      @case ('single') {
        <app-radio-group
          [options]="radioOptions"
          [value]="singleValue"
          (valueChange)="onSingleChange($event)" />
      }

      @case ('multiple') {
        <div class="qi-multi">
          @for (opt of question.options ?? []; track opt; let i = $index) {
            <app-checkbox
              [label]="opt"
              [checked]="isMultipleChecked(i)"
              (checkedChange)="onMultipleToggle(i, $event)" />
          }
        </div>
      }

      @case ('numeric') {
        <app-input
          type="text"
          inputmode="numeric"
          placeholder="0–255"
          [value]="numericValue"
          (valueChange)="onNumericChange($event)" />
        @if (numericError) {
        <div class="qi-error">
        {{ numericError }}
        </div>
        }
      }
    }
  </div>
</app-card>
