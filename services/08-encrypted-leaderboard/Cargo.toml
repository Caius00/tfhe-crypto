[package]
name = "encrypted-leaderboard"
version = "0.1.27"
edition = "2021"
publish = false
description = "Encrypted Leaderboard"

[features]
default = []
# Aktiviert den `gen_corpus`-Binary samt CLI-/JSON-Abhängigkeiten.
# Wird NICHT vom Service-Image gebaut (siehe `required-features` weiter unten),
# damit das Prod-Image schlank bleibt. Lokale Nutzung:
#   cargo run --release -p encrypted-leaderboard --features loadtest --bin gen_corpus -- ...
loadtest = ["dep:clap", "dep:anyhow", "dep:rand", "dep:tracing-subscriber", "dep:time"]

[dependencies]
tfhe = { workspace = true, features = ["software-prng"] }
axum.workspace = true
health.workspace = true
metrics-exporter.workspace = true
observability.workspace = true
openapi-docs.workspace = true
tracing = "0.1"
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22.1"
bincode = "1.3.3"
rayon = "1.10"
aide.workspace = true
schemars.workspace = true

# Nur für den `gen_corpus`-Binary aktiv — siehe `[features] loadtest`.
clap = { version = "4.5", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }
rand = { version = "0.8", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
time = { version = "0.3", features = ["formatting"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "encrypted-leaderboard"
path = "src/main.rs"

[[bin]]
name = "gen_corpus"
path = "src/bin/gen_corpus.rs"
required-features = ["loadtest"]
