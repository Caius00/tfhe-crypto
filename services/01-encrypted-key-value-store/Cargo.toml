[package]
name = "encrypted-key-value-store"
version = "0.1.20"
edition = "2021"
publish = false
description = "Encrypted Key-Value Store"

[dependencies]
aide.workspace = true
axum.workspace = true
health.workspace = true
metrics-exporter.workspace = true
observability.workspace = true
openapi-docs.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tfhe.workspace = true
tokio = { workspace = true, features = ["full"] }

base64 = "0.22.1"
bincode = "1.3.3"
dotenvy = "0.15.7"
redis = { version = "0.25", features = ["tokio-comp"] }
tracing = "0.1"
uuid = { version = "1.23.1", features = ["v4"] }

[dev-dependencies]
axum-test = "20.1.0"
serial_test = "3.5.0"
