[package]
name = "encrypted-image-processing"
version = "0.1.23"
edition = "2021"
publish = false
description = "Encrypted Image Processing"

[dependencies]
tfhe = { workspace = true, features = ["software-prng"] }
#axum.workspace = true
health.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
image = "0.25.10"
rayon = "1.12.0"
axum-test = "20.1.0"
bincode = "1.3.3"
axum = {version = "0.8.9", features = ["macros"]}

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.test]
inherits = "release"