[package]
name = "encrypted-age-verification"
version = "0.1.3"
edition = "2021"
publish = false
description = "Encrypted Age Verification"

[dependencies]
base64 = "0.22.1"
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
bincode = "1.3.3"

axum.workspace = true
health.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "x86_64")'.dependencies]
tfhe = { workspace = true, features = ["seeder_x86_64_rdseed"] }

[target.'cfg(all(not(target_arch = "x86_64"), unix))'.dependencies]
tfhe = { workspace = true, features = ["seeder_unix"] }
