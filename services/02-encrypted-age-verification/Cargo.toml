[package]
name = "encrypted-age-verification"
version = "0.1.14"
edition = "2021"
publish = false
description = "Encrypted Age Verification"

[dependencies]
base64 = "0.22.1"
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
bincode = "1.3.3"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["full"] }
http = "1.0"
axum-test = "15.0"
serial_test = "3.1.1"
axum.workspace = true
health.workspace = true
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
tfhe.workspace = true


