traefik:

  service:
    type: LoadBalancer

  ports:
    web:
      port: 8000
      exposedPort: 80
      protocol: TCP
    websecure:
      port: 8443
      exposedPort: 443
      protocol: TCP
    traefik:
      port: 9000
      exposedPort: 9000
      protocol: TCP
      expose:
        default: false  # true = Dashboard über LoadBalancer-IP:9000 erreichbar (nur für Debugging)
    redis:
      port: 6301
      exposedPort: 6301
      protocol: TCP
      expose:
        default: true
    postgres:
      port: 5432
      exposedPort: 5432
      protocol: TCP
      expose:
        default: true

  api:
    dashboard: true
    insecure: true

  additionalArguments:
    - "--api.insecure=true"

  providers:
    kubernetesCRD:
      enabled: false  # Traefik CRDs nicht installiert (--skip-crds), nur Gateway API wird genutzt
    kubernetesGateway:
      enabled: true
      experimentalChannel: true  # benötigt für TCPRoute / TLSRoute (experimental Gateway API)

  gatewayClass:
    enabled: true
    name: traefik

  logs:
    general:
      level: INFO
    access:
      enabled: true
