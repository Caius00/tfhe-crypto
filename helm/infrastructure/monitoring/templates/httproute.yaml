apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grafana
      # Kein URLRewrite: Grafana ist via `serve_from_sub_path: true` selbst
      # für den /grafana-Prefix konfiguriert und braucht den Pfad unverändert.
      backendRefs:
        - name: monitoring-grafana
          kind: Service
          port: 80
