namespace: 03-encrypted-voting-polling
replicaCount: 1

image:
  repository: ghcr.io/caius00/encrypted-voting-polling
  tag: "0.1.16"
  pullPolicy: IfNotPresent

service:
  port: 8080

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1536Mi

route:
  path: /voting
  gateway:
    name: traefik-gateway
    namespace: traefik
    sectionName: web
