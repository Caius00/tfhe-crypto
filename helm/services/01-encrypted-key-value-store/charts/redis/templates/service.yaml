{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis.fullname" . }}-master
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "redis.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "redis.fullname" . }}
  ports:
    - name: redis
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
{{- end }}
