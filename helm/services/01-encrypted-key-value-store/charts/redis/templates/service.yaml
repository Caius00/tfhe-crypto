{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullnameOverride | default (printf "%s-redis" .Release.Name) }}-master
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.fullnameOverride | default (printf "%s-redis" .Release.Name) }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Values.fullnameOverride | default (printf "%s-redis" .Release.Name) }}
  ports:
    - name: redis
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
{{- end }}
