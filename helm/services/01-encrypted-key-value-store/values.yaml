namespace: 01-encrypted-key-value-store
replicaCount: 1

image:
  repository: ghcr.io/caius00/encrypted-key-value-store
  tag: "0.1.12"
  pullPolicy: IfNotPresent

service:
  port: 8080

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1536Mi

route:
  path: /kv
  gateway:
    name: traefik-gateway
    namespace: traefik
    sectionName: web

redis:
  enabled: true
  auth:
    enabled: true
    password: "sCSm1$!s2XHQ2^Mp*#4P"
