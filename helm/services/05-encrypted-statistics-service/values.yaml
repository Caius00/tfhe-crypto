namespace: 05-encrypted-statistics-service
replicaCount: 1

image:
  repository: ghcr.io/caius00/encrypted-statistics-service
  tag: "0.1.14"
  pullPolicy: IfNotPresent

service:
  port: 8080

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1536Mi

route:
  path: /statistics
  gateway:
    name: traefik-gateway
    namespace: traefik
    sectionName: web
