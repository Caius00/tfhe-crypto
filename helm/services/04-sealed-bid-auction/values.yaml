namespace: 04-sealed-bid-auction
replicaCount: 1

image:
  repository: ghcr.io/caius00/sealed-bid-auction
  tag: "0.1.2"
  pullPolicy: IfNotPresent

service:
  port: 8080

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1536Mi

route:
  path: /auction
  gateway:
    name: traefik-gateway
    namespace: traefik
    sectionName: web
