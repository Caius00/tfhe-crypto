namespace: 09-encrypted-program-execution
replicaCount: 1

image:
  repository: ghcr.io/caius00/encrypted-program-execution
  tag: "0.1.12"
  pullPolicy: IfNotPresent

service:
  port: 8080

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1536Mi

route:
  path: /program-execution
  gateway:
    name: traefik-gateway
    namespace: traefik
    sectionName: web
