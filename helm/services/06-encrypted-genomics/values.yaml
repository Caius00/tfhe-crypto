namespace: 06-encrypted-genomics
# Default 0: KEDA HTTP Add-on skaliert auf 0 wenn kein Traffic kommt und hoch
# auf 1, sobald ein Request reinkommt (siehe templates/httpscaledobject.yaml).
# ArgoCD ignoriert /spec/replicas, damit KEDA dort frei drücken kann.
replicaCount: 0

image:
  repository: ghcr.io/caius00/encrypted-genomics
  tag: "0.1.18"
  pullPolicy: IfNotPresent

service:
  port: 8080

# Mit max. 1 aktivem Service-Pod gleichzeitig darf der eine Pod fast den
# ganzen Cluster (8 Cores / 16 GiB) nutzen. Headroom für k3s/Traefik/ArgoCD/Monitoring/KEDA:
# ~2 Cores + 4–5 GiB. Requests bleiben niedrig, damit Scheduling problemlos klappt.
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "6"
    memory: 10Gi

route:
  path: /genomics
  gateway:
    name: traefik-gateway
    namespace: traefik
    sectionName: web

postgresRoute:
  enabled: true
  gateway:
    name: traefik-gateway
    namespace: traefik
    sectionName: postgres

postgres:
  fullnameOverride: "genomics-postgres"
  enabled: true
  auth:
    username: genomics
    password: genomics
    database: genomics