namespace: 02-encrypted-age-verification
replicaCount: 1

image:
  repository: ghcr.io/caius00/encrypted-age-verification
  tag: "0.1.3"
  pullPolicy: IfNotPresent

service:
  port: 8080

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1536Mi

route:
  path: /age-verification
  gateway:
    name: traefik-gateway
    namespace: traefik
    sectionName: web
